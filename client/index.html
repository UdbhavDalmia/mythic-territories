      <h1 style="color: #f59e0b; font-size: 1.8rem; margin-bottom: 1rem;">Mythic Territories — Elemental Turn-Based Strategy Game</h1>
      <p>Mythic Territories is a free-to-play tactical browser game where two commanders clash in head-to-head combat using the opposing forces of Frost and Ash. Play online multiplayer, challenge an AI opponent, or duel locally on the same device.</p>
      
      <h2 style="color: #89ceff; font-size: 1.3rem; margin-top: 1.5rem; margin-bottom: 0.5rem;">Core Game Modes</h2>
      <ul>
        <li><strong>Online Multiplayer:</strong> Create private realm rooms with custom codes or match with open rooms worldwide.</li>
        <li><strong>Single-Player vs AI:</strong> Battle against an intelligent tactical AI with strategic pathfinding.</li>
        <li><strong>Local 2-Player:</strong> Pass-and-play combat on a single device.</li>
      </ul>

      <h2 style="color: #89ceff; font-size: 1.3rem; margin-top: 1.5rem; margin-bottom: 0.5rem;">Elemental Factions</h2>
      <p><strong>Frost Faction:</strong> Mastery over ice, defensive reinforcement, and battlefield control. Units include Arctic Trapper, Cryomancer, Frost Lord, Glacial Brute, Hoarfrost Mystic, Ice Weaver, Snow Wolf, Soul Freeze, Soul Linker, Void Chanter, Wisp, and Yeti.</p>
      <p><strong>Ash Faction:</strong> Destructive fire, high offensive burst, and area domination. Units include Ash Reaper, Ash Tyrant, Blaze Runner, Cinder Scout, Hell Hound, Magma Prowler, Magma Shaper, Magma Spitter, Rift Forger, Scorch Priest, and Obsidian Shaper.</p>

      <h2 style="color: #89ceff; font-size: 1.3rem; margin-top: 1.5rem; margin-bottom: 0.5rem;">Game Resources &amp; Guides</h2>
